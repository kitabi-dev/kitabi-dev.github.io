name: keepalive
on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "https://cqufhwvbyxqddsammqks.supabase.co/rest/v1/" -H "apikey: sb_publishable_bs9Q5AYXNM2ZpEgWNx804g__oS5aIZI")
          echo "HTTP $code"
          [ "$code" != "000" ] && [ "$code" -lt 500 ]
